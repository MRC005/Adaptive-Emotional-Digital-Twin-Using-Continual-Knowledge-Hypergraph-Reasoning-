[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aedt"
version = "0.4.0"
description = "Adaptive Emotional Digital Twin Using Continual Knowledge Hypergraph Reasoning - an ordinal probit slope-ratio estimator for longitudinal self-report recalibration against passive sensing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["response shift", "recalibration", "ordinal probit",
            "passive sensing", "digital phenotyping", "identifiability",
            "digital twin", "hypergraph"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# statsmodels is DELIBERATELY absent (ROUND-17 §S.13): the ordinal probit is
# implemented directly. tabulate is also absent: the Markdown table renderer in
# aedt/reporting/tables.py exists so the dependency set stays this small.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
aedt-demo = "aedt.demo:main"

[project.urls]
Repository = "https://github.com/MRC005/Adaptive-Emotional-Digital-Twin-Using-Continual-Knowledge-Hypergraph-Reasoning-"

[tool.setuptools.packages.find]
include = ["aedt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
