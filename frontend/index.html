<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEDT — Longitudinal Drift Analysis</title>
<meta name="description" content="Analysis workstation for detecting change in the relationship between a passively measured signal and a repeated self-report.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="appname">
      <b>Adaptive Emotional Digital Twin</b>
      <span>Longitudinal drift analysis</span>
    </div>
    <div class="tabs" id="tabs">
      <button data-tab="analyze" class="on">Analyze</button>
      <button data-tab="datasets">Datasets</button>
      <button data-tab="runs">Previous runs</button>
      <button data-tab="method">Method</button>
    </div>
    <div class="topright">
      <span id="loaded">No dataset loaded</span>
      <span class="engine" id="engine"><i></i><span>Ready</span></span>
    </div>
  </div>

  <div class="body">
    <aside class="side" id="side"></aside>
    <main class="workspace"><div class="sheet" id="work"></div></main>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
